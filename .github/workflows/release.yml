# Publishes an installable APK as a GitHub release.
#
# This only ever runs when you start it by hand: Actions -> Release -> Run workflow.
# Every push already builds an APK, but it lands as a workflow artifact, which needs a
# GitHub login to download. A release asset is a plain link you can open on your phone.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the release"
        required: true
        default: "v0.1.0"
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: |
          python3 tools/test_hub_program.py
          ./gradlew :core:test

      - name: Build
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - name: Name the files after the tag
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/prime-remote-${{ inputs.tag }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "out/prime-remote-${{ inputs.tag }}-optimised.apk" || true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Prime-Remote ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: out/*.apk
          body: |
            Download `prime-remote-${{ inputs.tag }}.apk`, copy it to your Android phone and
            open it. Android will ask you to allow installing from this source.

            Needs Android 8.0 or newer and a SPIKE Prime hub on SPIKE App 3 firmware.

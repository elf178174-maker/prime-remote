name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test the hub program
        run: python3 tools/test_hub_program.py

      - name: Check the golden protocol vectors are current
        run: |
          git clone --depth 1 https://github.com/LEGO/spike-prime-docs /tmp/spike-prime-docs
          python3 tools/gen_golden_vectors.py /tmp/spike-prime-docs/examples/python
          git diff --exit-code core/src/test/resources/golden_vectors.json

      - name: Unit tests
        run: ./gradlew :core:test --stacktrace

      # The build output is filtered down to the compiler errors: a failing Gradle run
      # buries them under hundreds of lines of stack trace.
      - name: Build the debug APK
        run: |
          ./gradlew :app:assembleDebug > build.log 2>&1 || true
          sed 's|file:///home/runner/work/prime-remote/prime-remote/||' build.log \
            | grep -E "^(e:|w: .*error)" | head -150 > errors.txt || true
          if [ -s errors.txt ]; then
            echo "=================== COMPILER ERRORS ==================="
            cat errors.txt
            exit 1
          fi
          if ! grep -q "BUILD SUCCESSFUL" build.log; then
            echo "=================== BUILD FAILED ==================="
            grep -A 20 "What went wrong" build.log | head -60
            tail -40 build.log
            exit 1
          fi
          echo "debug APK built"

      - name: Build the release APK
        run: |
          ./gradlew :app:assembleRelease > release.log 2>&1 || true
          if ! grep -q "BUILD SUCCESSFUL" release.log; then
            echo "=================== RELEASE BUILD FAILED ==================="
            sed 's|file:///home/runner/work/prime-remote/prime-remote/||' release.log \
              | grep -E "^(e:|w: .*error)" | head -100
            grep -A 20 "What went wrong" release.log | head -60
            exit 1
          fi
          echo "release APK built"

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: prime-remote-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/
          if-no-files-found: ignore
